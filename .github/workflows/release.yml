name: Build Artifacts

on:
  release:
    types:
      - created

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        config:
          - name: linux@amd64
            os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.name }}
    steps:
      - uses: actions/github-script@v7
        id: get_release
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { owner, repo } = context.repo;
            const { data: { upload_url } } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });

            core.setOutput('upload_url', upload_url);
            core.setOutput('tag', tag);

      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: this-repo

      - name: Checkout grpc/grpc
        uses: actions/checkout@v4
        with:
          repository: grpc/grpc
          ref: ${{ steps.get_release.outputs.tag }}
          path: grpc

      - name: Install Basilisk
        run: |
          wget https://github.com/bazelbuild/bazelisk/releases/download/v1.7.5/bazelisk-${{ matrix.config.platform }}-amd64
          chmod a+x bazelisk-${{ matrix.config.platform }}-amd64
          sudo mv bazelisk-${{ matrix.config.platform }}-amd64 /usr/local/bin/bazel

      - name: Build protoc, grpc_php_plugin and grpc_python_plugin
        working-directory: grpc
        run: |
          bazel build @com_google_protobuf//:protoc
          bazel build src/compiler:grpc_php_plugin
          bazel build src/compiler:grpc_python_plugin

      - name: Archive artifacts
        env:
          VERSION: ${{ steps.get_release.outputs.tag }}
        run: |
          cd grpc/bazel-bin/src/compiler/
          cp grpc_php_plugin_binary grpc-php-plugin
          tar czf grpc-php-plugin.${VERSION}.${{ matrix.config.platform }}.amd64.tar.gz grpc-php-plugin
          cp grpc_python_plugin_binary grpc-python-plugin
          tar czf grpc-python-plugin.${VERSION}.${{ matrix.config.platform }}.amd64.tar.gz grpc-python-plugin
          cp ../../external/com_google_protobuf/protoc protoc
          tar czf protoc.${VERSION}.${{ matrix.config.platform }}.amd64.tar.gz protoc

      - name: Upload Release Asset for grpc_php_plugin
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_path: grpc/bazel-bin/src/compiler/grpc-php-plugin.${{ steps.get_release.outputs.tag }}.${{ matrix.config.platform }}.amd64.tar.gz
          asset_name: grpc-php-plugin.${{ steps.get_release.outputs.tag }}.${{ matrix.config.platform }}.amd64.tar.gz
          asset_content_type: application/gzip

      - name: Upload Release Asset for grpc_python_plugin
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_path: grpc/bazel-bin/src/compiler/grpc-python-plugin.${{ steps.get_release.outputs.tag }}.${{ matrix.config.platform }}.amd64.tar.gz
          asset_name: grpc-python-plugin.${{ steps.get_release.outputs.tag }}.${{ matrix.config.platform }}.amd64.tar.gz
          asset_content_type: application/gzip

      - name: Upload Release Asset for protoc
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_path: grpc/bazel-bin/src/compiler/protoc.${{ steps.get_release.outputs.tag }}.${{ matrix.config.platform }}.amd64.tar.gz
          asset_name: protoc.${{ steps.get_release.outputs.tag }}.${{ matrix.config.platform }}.amd64.tar.gz
          asset_content_type: application/gzip

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: grpc/bazel-bin/src/compiler
          file: this-repo/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.get_release.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
